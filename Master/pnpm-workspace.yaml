packages:
  - "."

allowBuilds:
  esbuild: true

overrides:
  # CVE moderado (GHSA, "qs array-limit bypass via bracket-key comma
  # parsing"), qs>=6.14.2 <=6.15.3 vulnerável, precisa de >=6.16.0 — a
  # única dependência da família qs/body-parser/path-to-regexp que
  # continuava exposta em runtime real aqui (path-to-regexp e body-parser
  # já vinham patcheados por causa do express@4.22.2, mais novo que o do
  # app principal; ver auditoria V-36).
  qs: "6.16.0"
  # esbuild <=0.24.2 vulnerável (CORS do dev server) puxado só pela cadeia
  # depreciada drizzle-kit>@esbuild-kit/esm-loader>@esbuild-kit/core-utils
  # (drizzle-kit já usa esbuild ^0.25.4 direto — isso força a MESMA versão
  # segura pra dedupar a cópia antiga em vez de conviver com duas).
  esbuild: "^0.25.4"
  # Auditoria 2026-10-10 (pnpm audit): proxy-addr <2.0.8 permite falsificar o IP via sub-rede IPv4-mapeada-em-IPv6
  # no `trust proxy` do Express (CRÍTICO — o limite de tentativas depende do IP); brace-expansion <5.0.12 e
  # source-map-js <1.2.2 têm DoS (toolchain de lint/build).
  proxy-addr: ">=2.0.8"
  brace-expansion: ">=5.0.12"
  source-map-js: ">=1.2.2"
