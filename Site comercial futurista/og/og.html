<!doctype html>
<!-- Molde da imagem de compartilhamento (public/og-comandiva.png, 1200x630).
     Não vai para o build: abrir em http://localhost:5180/comercial/og/og.html e capturar 1200x630. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Clash Grotesk"; src: url("../fonts/clash-grotesk-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Satoshi"; src: url("../fonts/satoshi-500.woff2") format("woff2"); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(60% 60% at 8% 0%, rgba(0,200,240,.22), transparent 70%), radial-gradient(55% 60% at 95% 10%, rgba(84,36,240,.45), transparent 70%), radial-gradient(60% 60% at 80% 110%, rgba(169,139,255,.35), transparent 70%), linear-gradient(180deg, #070c22, #0e0b2a); color: #eef0f4; font-family: "Satoshi", sans-serif; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, #3a4a9055 1px, transparent 1px), linear-gradient(to bottom, #3a4a9055 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse 80% 70% at 30% 40%, #000 30%, transparent 80%); }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Clash Grotesk"; font-weight: 600; font-size: 34px; }
  .brand img { height: 44px; }
  .eyebrow { margin-top: 56px; font-family: ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; font-size: 18px; color: #4db0ff; }
  h1 { margin-top: 18px; font-family: "Clash Grotesk"; font-weight: 600; font-size: 76px; line-height: .95; letter-spacing: -0.02em; }
  h1 span { color: #9aa1b2; display: block; font-size: 40px; margin-top: 16px; letter-spacing: 0; }
  .foot { position: absolute; left: 72px; bottom: 56px; font-size: 22px; color: #9aa1b2; }
  .ticket { align-self: flex-start; margin-top: 30px; width: 330px; background: #f4efe6; color: #17140f; padding: 22px 24px 34px; transform: rotate(3deg); font-family: ui-monospace, monospace; font-size: 17px; text-transform: uppercase; letter-spacing: .05em;
    --t: 9px; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--t) * 2) var(--t) repeat-x, linear-gradient(#000 0 0) top / 100% calc(100% - var(--t)) no-repeat; box-shadow: 0 30px 60px rgba(0,0,0,.6); }
  .ticket .row { display: flex; justify-content: space-between; padding-top: 12px; }
  .ticket .soft { color: #6b6255; }
  .ticket .head { display: flex; justify-content: space-between; border-bottom: 2px dashed #6b625580; padding-bottom: 14px; font-family: "Clash Grotesk"; font-size: 24px; text-transform: none; letter-spacing: 0; }
  .ticket .total { border-top: 2px dashed #17140fb0; margin-top: 16px; padding-top: 14px; }
  .ok { color: #15803d; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div>
      <div class="brand"><img src="../comandiva-icon.png" alt="" />Comandiva</div>
      <p class="eyebrow">Sistema para restaurantes</p>
      <h1>Seu restaurante com<br />sistema próprio.<span>Zero comissão por pedido.</span></h1>
    </div>
    <div class="ticket">
      <div class="head"><span>Comandiva</span><span class="soft" style="font-family:ui-monospace,monospace;font-size:16px">18:00</span></div>
      <div class="row"><span class="soft">Pedido</span><span>Nº 0001</span></div>
      <div class="row"><span class="soft">Pagamento</span><span>Pix ✓</span></div>
      <div class="row"><span class="soft">Comissão</span><span>R$ 0,00</span></div>
      <div class="row total"><span>Marca</span><span class="ok">A sua ✓</span></div>
    </div>
  </div>
  <p class="foot">7 dias grátis · Sem cartão de crédito · mmsystem.tech</p>
</body>
</html>
