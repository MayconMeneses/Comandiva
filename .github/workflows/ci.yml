name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  app-principal:
    name: App principal (MM System Creator)
    runs-on: ubuntu-latest
    # Banco real só pra este job testar a migration de verdade (drizzle-kit
    # migrate) contra um MySQL de fato, não contra mock. Sobe junto do job
    # inteiro (não é escopado a um step só) e fica acessível em 127.0.0.1
    # porque o job roda direto na máquina do runner, não em container.
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci_app_principal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      # Versão fixa (10.4.1), igual ao "packageManager" do package.json da
      # raiz — evitar auto-detecção porque o job do saas-core (abaixo) usa
      # uma versão diferente do pnpm no próprio package.json dele.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Auditoria de vulnerabilidades de dependências — zerada em 2026-09
      # (achado de auditoria desta sessão: 26 dos 29 avisos vinham de uma
      # devDependency solta "pnpm" no package.json, resolvendo uma cópia
      # antiga e vulnerável do próprio pnpm dentro de node_modules, sem
      # relação com o pnpm real usado pra rodar comandos — removida; os
      # outros 3, transitivos de vite-plugin-pwa/drizzle-kit, corrigidos via
      # pnpm.overrides). Agora bloqueia merge de verdade.
      - name: Auditoria de vulnerabilidades
        run: pnpm audit --audit-level=critical
      - name: Lint
        run: pnpm run lint
      - run: pnpm run check
      # Aplica as migrations reais (drizzle/*.sql) contra o MySQL do serviço
      # acima, igual ao que acontece no boot do container de produção
      # (infra/entrypoint.sh → drizzle-kit migrate). Pega migration quebrada
      # ou fora de ordem antes de chegar em produção.
      - name: Migration contra banco real (drizzle-kit migrate)
        run: pnpm run db:migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/ci_app_principal
      - run: pnpm run build
      # Builda a imagem Docker real (mesmo Dockerfile usado em produção) só
      # pra garantir que o build da imagem não está quebrado — não publica/faz
      # push, só valida localmente no runner.
      - name: Build imagem Docker (app principal)
        run: docker build -f infra/Dockerfile .
      # DATABASE_URL aqui (mesmo serviço mysql:8.4 já de pé pro job inteiro,
      # já migrado no step acima) é só pro teste de idempotência de pedido
      # (server/order-idempotency-real-db.test.ts) — precisa de MySQL de
      # verdade pra provar que um erro de chave duplicada dentro de uma
      # transação não a invalida (comportamento específico do InnoDB, mock
      # não prova isso). O resto da suíte não usa banco nenhum.
      - run: pnpm test
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/ci_app_principal

  saas-core:
    name: saas-core (billing / Painel Master)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-core
    # Mesma lógica do job acima: banco real só pra testar a migration deste
    # serviço (schema/tabelas próprias do saas-core, nunca dado de restaurante).
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci_saas_core
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      # Versão fixa (11.24.0), igual ao "packageManager" de saas-core/package.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: saas-core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Auditoria de vulnerabilidades — zerada em 2026-09 (achado desta
      # sessão: vitest estava preso em ^2.1.4, trazendo vite<=6.4.2
      # vulnerável e um vitest com CVE crítico próprio; atualizado pra
      # ^4.1.11, mesma versão já usada no app principal). Mesma lógica do
      # job acima: agora bloqueia merge de verdade.
      - name: Auditoria de vulnerabilidades
        run: pnpm audit --audit-level=critical
      - name: Lint
        run: pnpm run lint
      - run: pnpm run check
      # Aplica as migrations reais do saas-core contra o MySQL do serviço
      # acima (mesmo comando usado no deploy real deste serviço).
      - name: Migration contra banco real (drizzle-kit migrate)
        run: pnpm run db:migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/ci_saas_core
      - run: pnpm run build
      # Builda a imagem Docker real do saas-core — contexto é a pasta
      # saas-core (não a raiz do repo), por isso o working-directory é
      # sobrescrito de volta pra raiz só neste step (o job inteiro usa
      # "saas-core" como default acima). Só valida o build, não publica.
      - name: Build imagem Docker (saas-core)
        working-directory: .
        run: docker build -f saas-core/infra/Dockerfile saas-core
      - run: pnpm test
