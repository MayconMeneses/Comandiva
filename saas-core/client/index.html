<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" /><!--
      Sem noindex global aqui de propósito: este mesmo HTML serve tanto o
      site comercial público (/comercial/*, precisa ser indexado) quanto o
      Painel Master (/, /login, /restaurantes etc., não deve aparecer no
      Google). Como é uma SPA de página única, a distinção é feita em tempo
      de execução — ver PanelLayout.tsx, que injeta <meta name="robots"
      content="noindex, nofollow"> só nas rotas do Painel Master.
    -->
    <title>MM System Creator — Painel Master</title>
    <!--
      Título/descrição/OG abaixo são o fallback ESTÁTICO — o que qualquer
      crawler que não execute JavaScript de verdade vê (preview de link do
      WhatsApp/Instagram/LinkedIn, por exemplo). Pra quem executa JS, cada
      página do site comercial sobrescreve em tempo de execução via
      usePageMeta.ts. Pras páginas listadas em shared/commercialPageMeta.ts
      (hoje: /comercial, /comercial/planos), o servidor TAMBÉM substitui
      esses valores direto no HTML antes de responder — ver
      server/_core/vite.ts — porque sem isso o preview compartilhado dessas
      páginas mostrava sempre este texto genérico do Painel Master, mesmo
      pra quem compartilha o link comercial no Instagram.
    -->
    <meta name="description" content="Sistema para restaurante com cardápio digital, pedidos online e pagamento por Pix e cartão, sem comissão por venda." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MM System Creator" />
    <meta property="og:title" content="MM System Creator — Painel Master" />
    <meta property="og:description" content="Sistema para restaurante com cardápio digital, pedidos online e pagamento por Pix e cartão, sem comissão por venda." />
    <meta property="og:image" content="https://mmsystem.tech/mm-logo-full.png" />
    <meta property="og:url" content="https://mmsystem.tech/" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MM System Creator — Painel Master" />
    <meta name="twitter:description" content="Sistema para restaurante com cardápio digital, pedidos online e pagamento por Pix e cartão, sem comissão por venda." />
    <meta name="twitter:image" content="https://mmsystem.tech/mm-logo-full.png" />
    <!-- Canônica estática (raiz) — sobrescrita por página via usePageMeta.ts
         (client) e injectCommercialPageMeta (server), mesmo raciocínio das
         tags og:*/twitter:* acima. -->
    <link rel="canonical" href="https://mmsystem.tech/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
